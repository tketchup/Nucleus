# ─────────────────────────────────────────────────────────────
#  Nucleus-Pl3xMap – Warps, Spawns und Mobs auf der Pl3xMap
#  Änderungen gelten nach einem Neustart.
# ─────────────────────────────────────────────────────────────

# Warps aus Nucleus (Modul teleport)
warps:
  enabled: true
  # Name der Ebene in der Karte ('' = je nach Nucleus-Sprache "Warps")
  label: ''
  # Ebene beim Öffnen der Karte ausgeblendet
  default-hidden: false
  # Diese Warps nicht auf der Karte zeigen (z. B. geheime Orte)
  hidden: []

# Spawnpunkte aus Nucleus (/setspawn). Den Vanilla-Weltspawn zeigt Pl3xMap selbst.
spawns:
  enabled: true
  label: ''
  default-hidden: false
  # Liegt der Nucleus-Spawn höchstens so viele Blöcke vom Vanilla-Weltspawn entfernt, wird er nicht extra
  # gezeigt (das Spawn-Symbol von Pl3xMap reicht). 0 = immer zeigen.
  hide-near-world-spawn: 16

# Lebende Mobs (keine Spieler)
mobs:
  enabled: true
  label: ''
  default-hidden: false
  # Wie oft die Positionen aktualisiert werden (Sekunden)
  update-seconds: 5
  # Höchstens so viele Mobs pro Welt (schützt Browser und Server bei großen Farmen)
  max-per-world: 400
  # Welche Arten gezeigt werden: feindlich (rot), friedlich (grün), sonstige wie Dorfbewohner (gelb)
  hostile: true
  passive: true
  other: true

# Symbole aus den Minecraft-Texturen: Mobs als Spawn-Ei, Warps mit dem Symbol aus dem Warps-GUI.
# Die Texturen gehören Mojang und sind deshalb nicht im Plugin enthalten. Sie werden einmal pro
# Minecraft-Version aus dem Minecraft-Client geholt und in plugins/Nucleus-Pl3xMap/textures/ gespeichert.
# Ohne Texturen gibt es einfache Symbole (farbige Punkte).
textures:
  # Client-Jar dieser Minecraft-Version einmalig direkt von Mojang laden (ca. 30 MB, wird danach gelöscht)
  download-from-mojang: false
  # Oder Pfad zu einer vorhandenen Client-Jar, z. B. aus dem Launcher (hat Vorrang vor dem Download)
  client-jar: ''
