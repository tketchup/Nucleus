  warmup: '<prefix>Teleporting in <hl><seconds></hl> seconds. Do not move!'
  # Action bar during the warmup
  countdown: 'Teleporting in <hl><seconds></hl> …'
  cancelled-move: '<prefix><err>Teleport cancelled because you moved.'
