# ─────────────────────────────────────────────────────────────
#  Nucleus – English texts (MiniMessage: https://docs.advntr.dev/minimessage/format.html)
#  Choose the language in config.yml → language: de | en
#  <prefix> is available everywhere, <hl>…</hl> highlights, <err> marks errors.
#  Set a message to '' to disable it. Missing keys are added automatically.
# ─────────────────────────────────────────────────────────────

# File version. On an update with a newer version the old file is kept as a backup.
version: 4

# Formats and words inserted by the code
format:
  # Date and time (Java DateTimeFormatter)
  date: 'yyyy-MM-dd HH:mm'
time:
  day: 'day'
  days: 'days'
  hour: 'hour'
  hours: 'hours'
  minute: 'minute'
  minutes: 'minutes'
  second: 'second'
  seconds: 'seconds'
general:
  console: 'Console'

# Argument names in usage hints (German word in the code → English)
usage-words:
  spieler: player
  ziel: target
  grund: reason
  nachricht: message
  sekunden: seconds
  betrag: amount
  verzauberung: enchantment
  stufe: level
  anzahl: amount
  dauer: duration
  aktion: action
  befehl: command
  welt: world
  zeit: time
  oder: or

# Put in front of every message containing <prefix>. Empty = no prefix.
prefix: ''

error:
  usage: '<prefix><err>Usage: <usage>'
  player-only: '<prefix><err>This command can only be used by players.'
  player-not-found: '<prefix><err>Player <hl><player></hl> not found.'
  no-permission: '<prefix><err>You do not have permission to do that.'
  world-not-found: '<prefix><err>World <hl><world></hl> not found.'
  internal: '<prefix><err>Internal error, see the server log for details.'

core:
  info: '<prefix>Nucleus <hl><version></hl> · <hl>/nucleus modules</hl>, <hl>/nucleus reload</hl>'
  reloaded: '<prefix>Configuration, messages and modules reloaded.'
  restart-needed: '<prefix>Modules were enabled or disabled. Commands only adjust after a restart (or /minecraft:reload).'
  import-started: '<prefix>EssentialsX import from <hl><folder></hl> running …'
  import-offline: '<prefix>UUIDs are converted to offline UUIDs using the player name (online-mode=false).'
  import-running: '<prefix><err>An import is already running.'
  import-no-folder: '<prefix><err>No EssentialsX folder found: <hl><folder></hl> (expected userdata/ or warps/).'
  import-done: '<prefix>EssentialsX import done: <hl><players></hl> players, <hl><homes></hl> homes (<homes_skipped> already existed), <hl><warps></hl> warps, <hl><jails></hl> jails, <hl><spawns></hl> spawn, <hl><balances></hl> balances, <hl><nicks></hl> nicknames, <hl><mutes></hl> mutes. Skipped: <skipped>, unreadable files: <broken>.'
  modules-header: '<prefix>Modules:'
  module-active: ' <green>●</green> <hl><module></hl> <dark_gray>– active'
  module-active-no-commands: ' <yellow>●</yellow> <hl><module></hl> <dark_gray>– active, commands after restart'
  module-disabled: ' <red>●</red> <hl><module></hl> <dark_gray>– off'
  module-disabled-commands: ' <red>●</red> <hl><module></hl> <dark_gray>– off, commands blocked until restart'

