# ─────────────────────────────────────────────────────────────
#  Nucleus – deutsche Texte (MiniMessage: https://docs.advntr.dev/minimessage/format.html)
#  Sprache wählen: config.yml → language: de | en
#  <prefix> ist überall verfügbar, <hl>…</hl> hebt hervor, <err> markiert Fehler.
#  Eine Nachricht auf '' setzen, um sie abzuschalten. Fehlende Schlüssel werden ergänzt.
# ─────────────────────────────────────────────────────────────

# Version der Datei. Bei einem Update mit neuer Version wird die alte Datei als Backup gesichert.
version: 4

# Formate und Wörter, die der Code einsetzt
format:
  # Datum und Uhrzeit (Java DateTimeFormatter)
  date: 'dd.MM.yyyy HH:mm'
time:
  day: 'Tag'
  days: 'Tage'
  hour: 'Stunde'
  hours: 'Stunden'
  minute: 'Minute'
  minutes: 'Minuten'
  second: 'Sekunde'
  seconds: 'Sekunden'
general:
  console: 'Konsole'

# Wird vor jede Nachricht gesetzt, die <prefix> enthält. Leer = kein Präfix.
prefix: ''

error:
  usage: '<prefix><err>Benutzung: <usage>'
  player-only: '<prefix><err>Dieser Befehl ist nur für Spieler.'
  player-not-found: '<prefix><err>Spieler <hl><player></hl> nicht gefunden.'
  no-permission: '<prefix><err>Dazu fehlt dir die Berechtigung.'
  world-not-found: '<prefix><err>Welt <hl><world></hl> nicht gefunden.'
  internal: '<prefix><err>Interner Fehler, Details stehen im Server-Log.'

core:
  info: '<prefix>Nucleus <hl><version></hl> · <hl>/nucleus modules</hl>, <hl>/nucleus reload</hl>'
  reloaded: '<prefix>Konfiguration, Nachrichten und Module neu geladen.'
  restart-needed: '<prefix>Module wurden an- oder abgeschaltet. Befehle passen sich erst nach einem Neustart (oder /minecraft:reload) an.'
  import-started: '<prefix>EssentialsX-Import aus <hl><folder></hl> läuft …'
  import-offline: '<prefix>UUIDs werden über den Spielernamen in Offline-UUIDs umgerechnet (online-mode=false).'
  import-texts: '<prefix>Übernommen: <hl><result></hl>. Ansehen mit <hl>/motd</hl>; eine vorher eigene MOTD liegt als Vorlage <hl>vor-import</hl> bereit (<hl>/motd template list</hl>).'
  import-texts-kept: '<prefix>MOTD/Regeln nicht übernommen, weil du schon eigene hast. Überschreiben mit <hl>/nucleus import essentials motd</hl>.'
  import-texts-none: 'nichts (keine motd.txt oder rules.txt gefunden)'
  import-running: '<prefix><err>Ein Import läuft bereits.'
  import-no-folder: '<prefix><err>Kein EssentialsX-Ordner gefunden: <hl><folder></hl> (erwartet userdata/ oder warps/).'
  import-done: '<prefix>EssentialsX-Import fertig: <hl><players></hl> Spieler, <hl><homes></hl> Homes (<homes_skipped> schon vorhanden), <hl><warps></hl> Warps, <hl><jails></hl> Jails, <hl><spawns></hl> Spawn, <hl><balances></hl> Kontostände, <hl><nicks></hl> Nicknames, <hl><mutes></hl> Mutes. Übersprungen: <skipped>, unlesbare Dateien: <broken>.'
  modules-header: '<prefix>Module:'
  module-active: ' <green>●</green> <hl><module></hl> <dark_gray>– aktiv'
  module-active-no-commands: ' <yellow>●</yellow> <hl><module></hl> <dark_gray>– aktiv, Befehle nach Neustart'
  module-disabled: ' <red>●</red> <hl><module></hl> <dark_gray>– aus'
  module-disabled-commands: ' <red>●</red> <hl><module></hl> <dark_gray>– aus, Befehle gesperrt bis Neustart'

