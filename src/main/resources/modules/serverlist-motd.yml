# ─────────────────────────────────────────────────────────────
#  Nucleus – Modul serverlist-motd (MOTD in der Serverliste)
#  An/aus in config.yml unter modules. Änderungen: /nucleus reload
#  Zeile 1: fester Text, Zeile 2: bei jedem Ping eine zufällige (erfundene) Meldung
#  über einen Spieler von der Whitelist. Texte in MiniMessage, z. B. <gold>, <#2ee59d>, <gradient:a:b>.
# ─────────────────────────────────────────────────────────────

# Erste Zeile. {version} = Minecraft-Version des Servers (z. B. 26.3)
line1: '<gradient:#2ee59d:#12b5ff>ketchby.me</gradient> <dark_gray>»</dark_gray> <white>Survival</white> <dark_gray>[<green>{version}</green>]</dark_gray>'

# Farbe des Spielernamens in Zeile 2 (Hex wie '#ffd166' oder Name wie 'gold')
player-color: '#ffd166'

# Grundfarbe von Zeile 2 (MiniMessage-Tag)
base-color: '<#9aa5b1>'

# Beide Zeilen mit vorangestellten Leerzeichen mittig ausrichten
center: true
# Breite der Serverliste in Pixeln: darauf wird zentriert, und längere Zeilen (schneidet der Client ab)
# werden vermieden, indem eine andere Kombination aus Name und Meldung gewählt wird. 0 = egal.
max-width: 250

# Woher die Namen für {player} kommen
names:
  # Spieler von der Whitelist
  whitelist: true
  # Zusätzliche Namen, die zufällig mit auftauchen
  extra:
    - Gronkh
    - Paluten
    - BastiGHG
    - GermanLetsPlay
    - Zombey
    - Maudado
    - Rewinside
    - Dner
    - Sturmwaffel
    - Unge

# Meldungen für Zeile 2, eine davon zufällig bei jedem Ping. {player} = zufälliger Name (Whitelist und
# names.extra; ohne Namen: "Jemand"). Meldungen ohne {player} gehen auch. Kurz halten: der Client zeigt nur
# etwa 250 Pixel, das sind rund 40 Zeichen samt Name.
# Leere Liste: die normale MOTD aus server.properties bleibt.
messages:
  # Todesursachen
  - '{player} wurde vom Creeper überrascht'
  - '{player} fiel in Lava. Schon wieder.'
  - '{player} wurde vom Skelett erschossen'
  - '{player} ist vom Himmel gefallen'
  - '{player} hat den Kaktus umarmt'
  - '{player} wollte in Lava baden'
  - '{player} ist im Kuhstall ertrunken'
  - '{player} wurde von Bienen erledigt'
  - '{player} fiel aus der Welt'
  - '{player} hat im Nether geschlafen'
  - '{player} hat TNT unterschätzt'
  - '{player} wurde vom Blitz getroffen'
  - '{player} erfror im Pulverschnee'
  - '{player} wurde vom Warden gefunden'
  - '{player} hat Piglins kein Gold gegeben'
  - '{player} wurde von Ziegen geschubst'
  - '{player} hat die Fallhöhe unterschätzt'
  - '{player} lief rückwärts in einen Creeper'
  - '{player} verhungerte neben 64 Steaks'
  - '{player} hat mit Phantomen gekuschelt'
  - '{player} wurde vom Ghast ausgelacht'
  - '{player} hat Wither-Rosen gepflückt'
  - '{player} wurde von einer Hexe verflucht'
  - '{player} hat Kies von unten abgebaut'
  # Sonstiges
  - '{player} hat gerade Diamanten gefunden'
  - '{player} baut heimlich was Riesiges'
  - '{player} verlor die Netherite-Rüstung'
  - '{player} hat sich im Wald verlaufen'
  - '{player} ist neidisch auf dein Haus'
  - '{player} wurde vom Händler abgezockt'
  - '{player} streamt gerade Redstone-Fails'
  - '{player} besiegte den Drachen (Lüge)'
  - '{player} tauscht Erde gegen Smaragde'
  - '{player} sucht seit Stunden ein Dorf'
  - '{player} wurde vom Phantom geweckt'
  - '{player} hat den Warden gestreichelt'
  - '{player} hat das Bett vergessen'
  - '{player} isst rohes Hühnchen'
  - '{player} baut wieder eine Erdhütte'
  - '{player} gräbt direkt nach unten'
  - '{player} hat die Elytra verlegt'
  - '{player} sammelt Blumen. 300 Stück.'
  - '{player} hat Angst vor Hühnern'
  - '{player} redet mit Dorfbewohnern'
  - '{player} war AFK. Im Nether.'
  - '{player} hat den Spawn geflutet'
  - '{player} hat 1000 Hühner. Hilfe.'
  - '{player} verkauft Sand in der Wüste'
  - '{player} hat Redstone erfunden'
  - '{player} hat ein Schwert mit Glück I'
  - '{player} hat die Katze adoptiert'
  - '{player} sucht Netherite mit Holzhacke'
  - '{player} hat einen Creeper benannt'
  - '{player} reitet ein Schwein. Stolz.'
  # Ohne Spieler
  - 'Heute Nacht wird es gefährlich'
  - 'Die Creeper halten ein Treffen ab'
  - 'Irgendwo ist ein Enderman sauer'
  - 'Gerüchten zufolge gibt es Diamanten'
  - 'Die Hühner planen etwas'
  - 'Der Warden hat schlechte Laune'
  - 'Es riecht nach Schwefel'
  - 'Die Dorfbewohner erhöhen die Preise'
